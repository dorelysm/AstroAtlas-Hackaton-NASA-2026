name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned app dependencies and the package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F821,F822,F823 app src tests
      - name: Tests (model, validation, i18n, PDF, app smoke test)
        run: pytest -q
