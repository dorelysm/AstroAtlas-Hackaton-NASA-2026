[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroatlas"
version = "0.1.0"
description = "Earth analog finder for Moon and Mars bases (NASA Space Apps 2026)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
app = ["streamlit", "pydeck"]
data = ["earthaccess", "pyhdf", "pyshp", "rasterio", "xarray", "geopandas", "h3", "python-dotenv"]
ml = ["umap-learn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
