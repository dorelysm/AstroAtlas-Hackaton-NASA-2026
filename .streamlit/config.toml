[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false

# Colours taken from the "AstroAtlas" interface proposal (Figma): background #0E1117, sidebar #161A23, cards #1B2030,
# orange accent #FF8C42, amber #FBBF24 (moderate match and warnings), green #34D399 (very similar) and blue #4C8DF6 (known analogs).
[theme]
base = "dark"
primaryColor = "#FF8C42"
linkColor = "#FF8C42"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1B2030"
borderColor = "#667085"  # ≥ 3:1 against the background: fields and boxes can be told apart (WCAG 1.4.11)
showWidgetBorder = true
headingFontSizes = ["2.75rem", "1.75rem", "1.5rem", "1.25rem", "1rem", "0.875rem"]
orangeColor = "#FF8C42"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#4C8DF6"
redColor = "#FF4B4B"

[theme.sidebar]
backgroundColor = "#161A23"
secondaryBackgroundColor = "#1B2030"
